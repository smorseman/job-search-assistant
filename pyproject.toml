[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-assistant"
version = "0.1.0"
description = "Automated civil-engineering job pipeline for James"
requires-python = ">=3.12"
dependencies = [
    # Settings
    "pydantic-settings>=2.2",

    # HTTP
    "httpx>=0.27",
    "tenacity>=8.3",               # retry / backoff

    # Data
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",              # fuzzy dedup

    # Google APIs
    "google-api-python-client>=2.130",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",

    # Document generation
    "anthropic>=0.69",            # output_config structured outputs + Message Batches
    "python-docx>=1.1",            # .docx output

    # Scheduling
    "apscheduler>=3.10",

    # CLI
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
jsa = "job_search.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_search*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 (line length): soft-enforced at 120 above; remaining offenders are
#   long string literals (HTTP URLs, SQL) where wrapping hurts readability.
# UP042 (StrEnum migration): defer until we benchmark; current behaviour is fine.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
