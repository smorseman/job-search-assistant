# ─────────────────────────────────────────────────────────────────────────────
# Match-score tuning — edit to recalibrate after funnel data accrues
# ─────────────────────────────────────────────────────────────────────────────

# ── Per-discipline base weights (drive discipline_contribution) ──────────────
discipline_weights:
  structural: 1.0
  construction_engineering: 0.8
  construction_management: 0.8
  land_development: 0.7
  site_civil: 0.7
  transportation: 0.6
  municipal: 0.6
  water_resources: 0.5
  environmental: 0.5
  geotechnical: 0.5
  federal: 0.5

# ── Match-score formula weights (must sum ≤ 1.00) ────────────────────────────
# match_score = base + discipline*discipline_weight + location*location_weight
#              + benefit*benefit_weight + trajectory*trajectory_weight
match_formula:
  base: 0.25                  # baseline floor (halved if knockouts fail)
  discipline_weight: 0.25     # 0–0.25 from discipline alignment
  location_weight: 0.30       # 0–0.30 from city-guide composite (0–100)
  benefit_weight: 0.10        # 0–0.10 from benefit signals (tuition, PE, etc.)
  trajectory_weight: 0.10     # 0–0.10 from career-trajectory signals

# ── Location framework (see config/cities.yaml + docs/city_guide.pdf) ────────
location:
  # Which weighting scheme to use as the location signal:
  #   fit_first    — 1/1/1/3/3   (lifestyle-dominant)
  #   balanced     — 1/1/1/1/1   (equal weight, default)
  #   career_relax — 3/2/2/0.5/1 (career-first, cannabis halved)
  #   career_first — 3/2/2/1/1   (career-dominant)
  #   career_only  — 3/2/1/0/0   (career + finances only, lifestyle excluded)
  scheme: balanced

# ── Operational thresholds ────────────────────────────────────────────────────
generation_threshold: 0.55      # min match_score to generate documents
max_docs_per_run: 15            # cap daily document generation
ghosted_days: 30                # auto-flag applications with no response after N days
followup_window_days: 14        # business-day follow-up window
