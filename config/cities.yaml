# ─────────────────────────────────────────────────────────────────────────────
# Civil Engineering City Guide — Top 50 U.S. Metros
# Source: docs/city_guide.pdf (Entry-Level Market Analysis, May 2026)
#
# Five dimensions, each scored 0.0–5.0:
#   ce        — CE Job Market (2/3 entry-volume + 1/3 density per 100K)
#   col       — COL-Adjusted Salary (real net ÷ RPP, normalized to best)
#   home      — Home Affordability (years to 20% down on starter; sliding roommate)
#   mj        — Cannabis Legal Status (Rec=5, MedEasy=4.5, MedMod=3.5,
#               Decrim=2.33, MedRestrict=2.0, Banned=1.0)
#   dating    — Dating Market (quadratic-penalized: 2/3 gender ratio + 1/3 pool)
#
# Composite formula: weighted_sum / (sum_weights × 5) × 100  →  0–100 scale
# Default scheme is "balanced"; override in config/scoring.yaml.
# ─────────────────────────────────────────────────────────────────────────────

schemes:
  fit_first:     {ce: 1,   col: 1, home: 1, mj: 3,   dating: 3}
  balanced:      {ce: 1,   col: 1, home: 1, mj: 1,   dating: 1}
  career_relax:  {ce: 3,   col: 2, home: 2, mj: 0.5, dating: 1}
  career_first:  {ce: 3,   col: 2, home: 2, mj: 1,   dating: 1}
  career_only:   {ce: 3,   col: 2, home: 1, mj: 0,   dating: 0}

# Fallback score (0–100) for postings in metros not in the top 50
fallback_composite: 40.0

